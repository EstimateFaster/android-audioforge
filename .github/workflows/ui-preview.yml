name: UI Preview APK

on:
  push:
    branches: [ui-builder]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & publish :uipreview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK 37.0 / Build Tools 37
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -1)"
          fi
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble UI preview APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :uipreview:assembleDebug

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(find uipreview/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "apk=$SRC"
          cp "$SRC" dist/AudioForge-UI-Preview.apk
          ls -lh dist/

      - name: Publish to GitHub Release (stable asset name)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ui-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create ui-preview \
              --repo "$GITHUB_REPOSITORY" \
              --title "AudioForge UI Preview (滚动更新)" \
              --notes "纯 UI 预览构建，自动覆盖更新。仅用于设计验收，不含业务功能。" \
              --prerelease
          gh release upload ui-preview dist/AudioForge-UI-Preview.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/ui-preview/AudioForge-UI-Preview.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: uipreview-apk
          path: dist/AudioForge-UI-Preview.apk
          retention-days: 7

  screenshots:
    name: Emulator screenshots
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[no-shots]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: uipreview-apk
          path: uipreview-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ui-preview-shots.sh

      - name: Zip screenshots
        run: |
          cd shots
          zip -r ../ui-preview-shots.zip .
          cd ..
          ls -lh ui-preview-shots.zip

      - name: Publish screenshots release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ui-preview-shots --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create ui-preview-shots \
              --repo "$GITHUB_REPOSITORY" \
              --title "AudioForge UI Preview · 截图" \
              --notes "模拟器逐屏截图（浅/深色、200% 字号、空/错误态）。" \
              --prerelease
          gh release upload ui-preview-shots ui-preview-shots.zip \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview-shots
          path: shots
          retention-days: 7
          if-no-files-found: warn
