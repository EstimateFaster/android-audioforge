name: Android Smoke (emulator)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/src/main/**"
      - "app/src/androidTest/**"
      - ".github/workflows/smoke.yml"

permissions:
  contents: read

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK 37.0 / Build Tools 37
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -1)"
          fi
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            chmod +x ./gradlew
            adb logcat -c
            ./gradlew --no-daemon :app:installDebug :app:installDebugAndroidTest || true
            adb shell am instrument -w -e class com.estimatefaster.audioforge.ui.ScreenshotSmokeTest com.estimatefaster.audioforge.debug.test/androidx.test.runner.AndroidJUnitRunner || true
            adb pull /sdcard/Android/data/com.estimatefaster.audioforge.debug/files/screenshots ./screenshots || true
            ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest; echo $? > test-exit.txt
            ./gradlew --no-daemon :app:installDebug || true
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb shell am start -W -n com.estimatefaster.audioforge.debug/com.estimatefaster.audioforge.MainActivity || true
            sleep 4
            adb exec-out screencap -p > smoke-home.png || true
            adb pull /sdcard/Android/data/com.estimatefaster.audioforge.debug/files/screenshots ./screenshots || true
            printf 'model=%s\nandroid=%s\nsdk=%s\nabi=%s\n' "$(adb shell getprop ro.product.model | tr -d '\r')" "$(adb shell getprop ro.build.version.release | tr -d '\r')" "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" "$(adb shell getprop ro.product.cpu.abi | tr -d '\r')" > device-info.txt
            adb logcat -d > logcat-smoke.txt || true
            exit $(cat test-exit.txt || echo 1)

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            logcat-smoke.txt
            smoke-home.png
            screenshots/**
            device-info.txt
            test-exit.txt
          if-no-files-found: warn
          retention-days: 14
